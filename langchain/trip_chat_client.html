<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trip Planner Chat</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    background: #0f1117;
    color: #e5e5e5;
  }
  #config {
    margin-bottom: 16px;
  }
  #config input {
    width: 100%;
    padding: 8px;
    background: #1a1d29;
    border: 1px solid #333;
    color: #e5e5e5;
    border-radius: 6px;
  }
  #chatBox {
    border: 1px solid #333;
    border-radius: 8px;
    height: 450px;
    overflow-y: auto;
    padding: 16px;
    background: #1a1d29;
    margin-bottom: 12px;
  }
  .msg {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 80%;
    line-height: 1.4;
  }
  .user {
    background: #2b5797;
    margin-left: auto;
    text-align: right;
  }
  .assistant {
    background: #2a2d3a;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  #messageInput {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1d29;
    color: #e5e5e5;
  }
  button {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    background: #2b5797;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    background: #444;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<h2>Trip Planner Chat</h2>

<div id="chatBox"></div>

<div class="row">
  <input id="messageInput" type="text" placeholder="Ask about weather, currency, or places to explore...">
  <button id="sendBtn">Send</button>
</div>

<script>
  // A random session_id, generated once when the page loads. As long
  // as you don't reload the page, this stays the same - so the
  // backend's memory (all_conversations dictionary) recognizes you as
  // the same "session" across multiple messages.
  const sessionId = crypto.randomUUID();

  const chatBox = document.getElementById("chatBox");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const message = input.value.trim();

    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message, session_id: sessionId })
      });

      if (!response.ok) {
        const errorText = await response.text();
        addMessage("Error " + response.status + ": " + errorText, "assistant");
        return;
      }

      const data = await response.json();
      addMessage(data.answer, "assistant");
    } catch (err) {
      addMessage("Request failed: " + err.message, "assistant");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
